name: WebKit

# The app in Safari, on macOS (tools/webkit.mjs): the layout checks Chrome does not catch,
# such as a page wider than an iPhone's screen. Not yet required for a deploy: it will be
# once it has proved steady.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Let safaridriver drive Safari
        run: sudo safaridriver --enable
      - name: The app in Safari
        run: node tools/webkit.mjs
