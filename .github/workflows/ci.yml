name: CI

# Pull requests are checked here. Pushes to main are checked by the deploy workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: for f in js/*.js sw.js tools/*.mjs tools/lib/*.mjs; do node --check "$f"; done
      - name: Example trip, offline file list, no private data
        run: npm run check
      - name: Tests
        run: npm test
      - name: In a browser
        # The runner image ships Google Chrome. No connection is needed: map tiles are not checked here.
        env:
          CHROME: google-chrome
        run: npm run e2e
      - name: Build
        run: node tools/build.mjs --out _site
