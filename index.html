<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Travel in my pocket</title>
<meta name="description" content="A pocket travel guide that works offline. The app is public, your trip stays on your phone.">
<meta name="theme-color" content="#f2f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101316" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="In my pocket">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="strip" hidden><div class="gutter"><nav id="days"></nav></div></header>
<main id="app" class="gutter"></main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<noscript><p style="padding:16px">Travel in my pocket needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
